<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATE E-Vote - Bilik Pemilihan</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .standby-screen {
            text-align: center;
        }

        .standby-screen h1 {
            font-size: 3em;
            color: #d4d94a;
            text-shadow: 0 0 30px rgba(212, 217, 74, 0.6);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .standby-screen p {
            font-size: 1.5em;
            color: #aaaaaa;
        }

        .voting-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        .voter-info {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(212, 217, 74, 0.1);
            border: 2px solid #d4d94a;
            border-radius: 10px;
        }

        .voter-info h2 {
            color: #d4d94a;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .voter-info p {
            color: #FFFFFF;
            font-size: 1.2em;
        }

        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .candidate-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(212, 217, 74, 0.3);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .candidate-card:hover {
            transform: scale(1.03) translateY(-6px);
            border-color: #d4d94a;
            box-shadow: 0 10px 30px rgba(212, 217, 74, 0.3);
        }

        .candidate-photo {
            width: 100%;
            height: 200px;
            background: rgba(212, 217, 74, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4d94a;
            font-size: 3em;
            position: relative;
        }

        .candidate-name {
            font-size: 1.3em;
            color: #d4d94a;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .candidate-desc {
            color: #aaaaaa;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #d4d94a;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .modal-content h3 {
            color: #d4d94a;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #FFFFFF;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #d4d94a, #c4c93a);
            color: #000000;
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 217, 74, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(212, 217, 74, 0.5);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .loading {
            text-align: center;
            color: #d4d94a;
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 217, 74, 0.3);
            border-top: 3px solid #d4d94a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .candidates-grid {
                grid-template-columns: 1fr;
            }

            .standby-screen h1 {
                font-size: 2em;
            }

            .modal-content {
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Standby Screen -->
        <div class="standby-screen" id="standbyScreen">
            <h1>SIAP MEMILIH</h1>
            <p>Menunggu pemilih...</p>
        </div>

        <!-- Voting Screen -->
        <div class="voting-screen" id="votingScreen">
            <div class="voter-info">
                <h2>Selamat datang, <span id="voterName"></span></h2>
                <p>Silakan pilih satu kandidat</p>
            </div>

            <div class="candidates-grid" id="candidatesGrid">
                <!-- Candidates will be loaded here -->
            </div>
        </div>

        <!-- Loading Screen -->
        <div class="loading" id="loadingScreen">
            <div class="loading-spinner"></div>
            <p>Memproses suara Anda...</p>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Konfirmasi Pilihan</h3>
            <p>Anda memilih <strong id="selectedCandidateName"></strong></p>
            <p style="color: #aaaaaa; font-size: 0.9em;">Pastikan pilihan Anda sudah benar sebelum melanjutkan</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cancelVote()">Batal</button>
                <button class="btn-confirm" onclick="confirmVote()">Konfirmasi</button>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.js"></script>
    <script src="/static/js/voting.js"></script>
</body>
</html>
