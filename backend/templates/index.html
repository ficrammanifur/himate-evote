<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATE E-Vote - Panitia</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>HIMATE E-VOTE</h1>
            <p class="subtitle">Sistem Pemilihan Elektronik Kampus</p>
        </header>

        <div class="main-grid">
            <!-- Absensi Section -->
            <div class="card">
                <h2>Absensi Pemilih</h2>
                <div id="absensiMessage" class="message"></div>
                <form id="absensiForm">
                    <div class="form-group">
                        <label for="nim">NIM / ID Pemilih</label>
                        <input type="text" id="nim" name="nim" placeholder="Masukkan NIM" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Nama Pemilih</label>
                        <input type="text" id="name" name="name" placeholder="Masukkan nama lengkap" required>
                    </div>
                    <button type="submit">Daftar Absensi</button>
                </form>
            </div>

            <!-- Dashboard Section -->
            <div class="card">
                <h2>Dashboard Realtime</h2>
                <div class="stats-container">
                    <div class="stat-box">
                        <div class="stat-value" id="totalVoters">0</div>
                        <div class="stat-label">Total Pemilih</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="votedCount">0</div>
                        <div class="stat-label">Sudah Memilih</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="turnoutPercentage">0%</div>
                        <div class="stat-label">Turnout</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="voteChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Queue Section -->
        <div class="card">
            <h2>Antrian Pemilih</h2>
            <div class="queue-list" id="queueList">
                <div style="padding: 20px; text-align: center; color: #aaaaaa;">
                    Antrian kosong
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
