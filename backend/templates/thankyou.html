<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIMATE E-Vote - Terima Kasih</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            margin-bottom: 30px;
            position: relative;
        }

        .checkmark-circle {
            width: 100%;
            height: 100%;
            border: 3px solid #d4d94a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.6s ease-out;
        }

        .checkmark-check {
            font-size: 60px;
            color: #d4d94a;
            animation: checkAnimation 0.6s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes checkAnimation {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5em;
            color: #d4d94a;
            text-shadow: 0 0 20px rgba(212, 217, 74, 0.5);
            margin-bottom: 20px;
        }

        .message {
            font-size: 1.3em;
            color: #FFFFFF;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .tagline {
            font-size: 1.5em;
            color: #d4d94a;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(212, 217, 74, 0.4);
        }

        .button-container {
            margin-top: 30px;
        }

        button {
            background: linear-gradient(135deg, #d4d94a, #c4c93a);
            color: #000000;
            border: none;
            padding: 15px 40px;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 217, 74, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Confetti animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #d4d94a;
            pointer-events: none;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .message {
                font-size: 1.1em;
            }

            .tagline {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">
            <div class="checkmark-circle">
                <span class="checkmark-check">✓</span>
            </div>
        </div>

        <h1>Terima Kasih!</h1>
        <p class="message">Terima kasih telah menggunakan hak suara Anda.</p>
        <p class="tagline">HIMATE É La FAMILIA</p>

        <div class="button-container">
            <button onclick="resetBooth()">Selesai / Keluar</button>
        </div>
    </div>

    <script src="/static/js/socket.js"></script>
    <script>
        // Create confetti
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = Math.random() > 0.5 ? '#d4d94a' : '#FFFFFF';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }
        }

        function resetBooth() {
            socket.emit('bilik_reset');
            setTimeout(() => {
                window.location.href = '/voting';
            }, 500);
        }

        // Create confetti on page load
        window.addEventListener('load', createConfetti);
    </script>
</body>
</html>
