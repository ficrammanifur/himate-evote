<!-- admin_login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login - HIMATE E-VOTE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <img src="{{ url_for('static', filename='img/himate_logo.png') }}" alt="HIMATE Logo" class="admin-logo">
            <h1>Super Admin Login</h1>
            <p>Masukkan kredensial untuk mengakses panel super admin.</p>
            <form id="adminLoginForm" action="/admin" method="POST">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="admin-btn">Login</button>
            </form>
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
            <a href="/" class="back-link">Kembali ke Dashboard Panitia</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
